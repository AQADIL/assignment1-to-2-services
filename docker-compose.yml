services:
  nats:
    image: nats:2
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  order-service:
    image: golang:1.24
    working_dir: /app
    command: ["sh", "-c", "go mod download && CGO_ENABLED=1 go run ./cmd/main.go"]
    ports:
      - "8081:8080"
      - "50052:50052"
    environment:
      - ORDER_DB=/app/order.db
      - PAYMENT_GRPC_ADDR=payment-service:50051
      - NATS_URL=nats://nats:4222
      - HTTP_PORT=8080
      - GRPC_PORT=50052
      - GONOSUMCHECK=github.com/AQADIL/*
      - GONOSUMDB=github.com/AQADIL/*
      - GOFLAGS=-mod=mod
    volumes:
      - ./order-service:/app
    depends_on:
      - payment-service
      - nats

  payment-service:
    image: golang:1.24
    working_dir: /app
    command: ["sh", "-c", "go mod download && CGO_ENABLED=1 go run ./cmd/main.go"]
    ports:
      - "50051:50051"
    environment:
      - PAYMENT_DB=/app/payment.db
      - GRPC_PORT=50051
      - NATS_URL=nats://nats:4222
      - GONOSUMCHECK=github.com/AQADIL/*
      - GONOSUMDB=github.com/AQADIL/*
      - GOFLAGS=-mod=mod
    volumes:
      - ./payment-service:/app

  notification-service:
    image: golang:1.24
    working_dir: /app
    command: ["sh", "-c", "go mod download && CGO_ENABLED=1 go run ./cmd/main.go"]
    environment:
      - NOTIFICATION_DB=/app/notification.db
      - NATS_URL=nats://nats:4222
      - GONOSUMCHECK=github.com/AQADIL/*
      - GONOSUMDB=github.com/AQADIL/*
      - GOFLAGS=-mod=mod
    volumes:
      - ./notification-service:/app
    depends_on:
      - nats
